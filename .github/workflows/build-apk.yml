name: Build RooT box APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build RooT box APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p build_output/
          find app/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \;
          echo "Generated APKs:"
          ls -la build_output/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RooT-box-APKs
          path: build_output/*.apk
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: build_output/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
